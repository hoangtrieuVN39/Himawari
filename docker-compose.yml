services:
  ingestor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airport_weather_ingestor
    restart: unless-stopped
    volumes:
      - ./config:/app/config:ro
      - ./src:/app/src:ro
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python", "-m", "src.ingestion.run_ingest", "--loop"]

  runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airport_weather_runner
    profiles: ["tools"]
    volumes:
      - ./config:/app/config:ro
      - ./src:/app/src:ro
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1

  spark-processor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airport_weather_spark_processor
    profiles: ["spark"]
    volumes:
      - ./config:/app/config:ro
      - ./src:/app/src
      - ./tests:/app/tests:ro
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - SPARK_LOCAL_IP=127.0.0.1
    depends_on:
      - namenode

  dashboard:
    build: .
    container_name: weather-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    command: ["streamlit", "run", "src/dashboard/app.py"]

  namenode:
    image: apache/hadoop:3
    container_name: hadoop_namenode
    hostname: namenode
    restart: unless-stopped
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"
      - "9000:9000"
    env_file:
      - ./config/hadoop/hadoop.env
    environment:
      - ENSURE_NAMENODE_DIR=/tmp/hadoop-root/dfs/name
    volumes:
      - hadoop_namenode:/opt/hadoop/data/name

  datanode:
    image: apache/hadoop:3
    container_name: hadoop_datanode
    hostname: datanode
    restart: unless-stopped
    command: ["hdfs", "datanode"]
    ports:
      - "9864:9864"
    env_file:
      - ./config/hadoop/hadoop.env
    volumes:
      - hadoop_datanode:/opt/hadoop/data/data
    depends_on:
      - namenode

volumes:
  hadoop_namenode:
  hadoop_datanode:
